name: Rebuild historical offline package

# Historical releases retain their existing packaging. New manifest-based
# distributions use release-distribution.yml; offline delivery for them is a
# separate follow-up, not an alternative image/version selector.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing historical distro tag without a deployment manifest
        required: true
      bridge_version:
        description: Bridge version required by that historical release's build.sh
        required: true

permissions:
  contents: write

concurrency:
  group: historical-installer
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate historical version inputs
        env:
          VERSION: ${{ inputs.version }}
          BRIDGE: ${{ inputs.bridge_version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]] && [[ "$BRIDGE" =~ ^[0-9]+(\.[0-9]+)+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.version }}
          persist-credentials: false
      - name: Build only from an existing historical tag
        env:
          VERSION: ${{ inputs.version }}
          BRIDGE: ${{ inputs.bridge_version }}
        run: |
          set -euo pipefail
          test ! -f deployment-manifest.json || { echo 'Offline packaging for manifest-based releases is not available in this workflow'; exit 1; }
          ./build.sh "$VERSION" "$BRIDGE"
      - name: Attach without overwriting a package or changing its release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          file=$(find OEDockerInstaller -name '*.tar.gz' -print -quit)
          test -n "$file"
          gh release upload "$VERSION" "$file"
