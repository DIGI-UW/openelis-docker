name: Build OpenELIS-Global-2 Offline Docker Images

# Builds the offline installer and attaches it to the openelis-docker release
# of the same version. It runs when a release is published here, when started
# by hand for an OpenELIS-Global-2 release tag, and once a day for the latest
# OpenELIS-Global-2 release that has no package yet (creating the matching
# release here), so every release ships an offline package.
#
# OpenELIS-Global-2 and the analyser Bridge are released separately, so a
# package names both versions. Started by hand, both are inputs. A published
# release or the daily run takes the Bridge release the OpenELIS release was
# built with (scripts/bridge-version-for.sh). The compose file is pinned to
# both with scripts/pin-versions.sh, committed and tagged, and build.sh gets
# the same two versions. A published release is built from its own tag; any
# other run releases from the branch it runs on (or base_ref), so running it
# again for an existing version moves that tag onto the current packaging.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: OpenELIS-Global-2 release tag to package; also the version of this release (for example 3.3.0)
        required: true
      bridge_version:
        description: Analyser Bridge release tag to ship with it (for example 3.4.1). scripts/bridge-version-for.sh <version> prints the one OpenELIS was built with.
        required: true
      base_ref:
        description: Branch or commit to release from (default, the branch this runs on)
        required: false
        default: ""
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-installer
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the version and its release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      bridge: ${{ steps.resolve.outputs.bridge }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the version to package
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_BRIDGE: ${{ github.event.inputs.bridge_version }}
        run: |
          case "$EVENT" in
            release) TAG="$RELEASE_TAG" ;;
            workflow_dispatch) TAG="$INPUT_VERSION" ;;
            *) TAG=$(gh api repos/DIGI-UW/OpenELIS-Global-2/releases/latest --jq .tag_name) ;;
          esac
          for v in "$TAG" "${INPUT_BRIDGE:-0.0}"; do
            if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
              echo "::error::'$v' is not a release version (for example 3.3.0)"
              exit 1
            fi
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version to package: $TAG"
          if [ "$EVENT" = schedule ] && gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '_docker_installer.tar.gz$'; then
            echo "release $TAG already has its offline package; nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BUILT_WITH=$(./scripts/bridge-version-for.sh "$TAG" || true)
          if [ -n "$INPUT_BRIDGE" ]; then
            BRIDGE="$INPUT_BRIDGE"
            if [ "$BRIDGE" != "$BUILT_WITH" ]; then
              echo "::warning::OpenELIS $TAG was built with analyser Bridge ${BUILT_WITH:-<no release>}; packaging Bridge $BRIDGE as requested"
            fi
          elif [ -n "$BUILT_WITH" ]; then
            BRIDGE="$BUILT_WITH"
          else
            echo "::error::no analyser Bridge release matches OpenELIS $TAG; run this workflow by hand and name the Bridge version"
            exit 1
          fi
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "analyser Bridge version: $BRIDGE"
          for image in openelis-global-2 openelis-global-2-frontend openelis-global-2-fhir openelis-global-2-database openelis-global-2-proxy; do
            if ! docker manifest inspect "itechuw/${image}:${TAG}" >/dev/null 2>&1; then
              if [ "$EVENT" = schedule ]; then
                echo "::warning::itechuw/${image}:${TAG} is not on Docker Hub yet; trying again tomorrow"
                echo "build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::itechuw/${image}:${TAG} is not on Docker Hub; publish the OpenELIS-Global-2 ${TAG} images first"
              exit 1
            fi
          done
          if ! docker manifest inspect "itechuw/openelis-analyzer-bridge:${BRIDGE}" >/dev/null 2>&1; then
            echo "::error::itechuw/openelis-analyzer-bridge:${BRIDGE} is not on Docker Hub; publish the analyser Bridge ${BRIDGE} release first"
            exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Pin the compose file to both versions and tag it
        if: steps.resolve.outputs.build == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          BRIDGE: ${{ steps.resolve.outputs.bridge }}
          BASE_REF: ${{ github.event.inputs.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # base_ref may predate these scripts; run the current ones.
          cp -r scripts "$RUNNER_TEMP/scripts"
          if [ -n "$BASE_REF" ]; then
            git checkout -q "$BASE_REF"
          fi
          echo "releasing from $(git rev-parse --short HEAD)"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            existing=true
          else
            existing=false
          fi
          "$RUNNER_TEMP/scripts/pin-versions.sh" "$TAG" "$BRIDGE" docker-compose.yml
          "$RUNNER_TEMP/scripts/check-release-pins.sh" docker-compose.yml
          git add docker-compose.yml
          if git diff --staged --quiet; then
            echo "docker-compose.yml already pinned to OpenELIS $TAG and analyser Bridge $BRIDGE"
          else
            git commit -q -m "release: ${TAG}" -m "OpenELIS-Global-2: ${TAG}
          Analyser Bridge: ${BRIDGE}"
          fi
          if [ "$existing" = true ]; then
            git tag -f "$TAG"
            git push origin "$TAG" --force
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create the release when it does not exist
        if: steps.resolve.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          BRIDGE: ${{ steps.resolve.outputs.bridge }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --title "OpenELIS-Global2 Docker ${TAG} Release" \
              --notes "Offline installer for OpenELIS-Global-2 ${TAG} (https://github.com/DIGI-UW/OpenELIS-Global-2/releases/tag/${TAG}) with analyser Bridge ${BRIDGE} (https://github.com/DIGI-UW/openelis-analyzer-bridge/releases/tag/${BRIDGE})."
          fi

  build:
    name: Build and attach the installer
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BRIDGE: ${{ needs.prepare.outputs.bridge }}
        run: ./build.sh "$TAG" "$BRIDGE"

      - name: Check the package holds every compose image at its version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BRIDGE: ${{ needs.prepare.outputs.bridge }}
        run: |
          ls -l OEDockerInstaller
          FILE=$(find OEDockerInstaller -name "*.tar.gz" -print -quit)
          tar -xzf "$FILE" --wildcards '*/dockerImage/images.txt' -O | tee images.txt
          grep -qx "itechuw/openelis-global-2-database:${TAG}" images.txt
          grep -qx "itechuw/openelis-analyzer-bridge:${BRIDGE}" images.txt
          if grep -E ':(develop|latest)$' images.txt; then
            echo "::error::the package holds moving tags"
            exit 1
          fi

      - name: Upload the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(find OEDockerInstaller -name "*.tar.gz" -print -quit)
          gh release upload "${{ needs.prepare.outputs.tag }}" "$FILE" --clobber
