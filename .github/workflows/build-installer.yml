name: Build OpenELIS-Global-2 Offline Docker Images

# Builds the offline installer and attaches it to the openelis-docker release
# of the same version. It runs when a release is published here, when started
# by hand for an OpenELIS-Global-2 release tag, and once a day for the latest
# OpenELIS-Global-2 release that has no package yet (creating the matching
# release here), so every release ships an offline package.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: OpenELIS-Global-2 release tag to package (for example 3.2.3.0)
        required: true
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: build-installer
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve the version and its release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the version to package
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          case "$EVENT" in
            release) TAG="$RELEASE_TAG" ;;
            workflow_dispatch) TAG="$INPUT_VERSION" ;;
            *) TAG=$(gh api repos/DIGI-UW/OpenELIS-Global-2/releases/latest --jq .tag_name) ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version to package: $TAG"
          if [ "$EVENT" = schedule ] && gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '_docker_installer.tar.gz$'; then
            echo "release $TAG already has its offline package; nothing to do"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for image in openelis-global-2 openelis-global-2-frontend openelis-global-2-fhir openelis-global-2-database openelis-global-2-proxy; do
            if ! docker manifest inspect "itechuw/${image}:${TAG}" >/dev/null 2>&1; then
              if [ "$EVENT" = schedule ]; then
                echo "::warning::itechuw/${image}:${TAG} is not on Docker Hub yet; trying again tomorrow"
                echo "build=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "::error::itechuw/${image}:${TAG} is not on Docker Hub; publish the OpenELIS-Global-2 ${TAG} images first"
              exit 1
            fi
          done
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Pin the compose file to the version and tag it
        if: steps.resolve.outputs.build == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git checkout -q "$TAG"
            existing=true
          else
            existing=false
          fi
          sed -i "s/:develop/:${TAG}/g" docker-compose.yml
          git add docker-compose.yml
          if git diff --staged --quiet; then
            echo "docker-compose.yml already pinned to $TAG"
          else
            git commit -q -m "chore: update image tags to ${TAG} for release"
          fi
          if [ "$existing" = true ]; then
            git tag -f "$TAG"
            git push origin "$TAG" --force
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create the release when it does not exist
        if: steps.resolve.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists"
          else
            gh release create "$TAG" --title "OpenELIS-Global2 Docker ${TAG} Release" \
              --notes "Offline installer for OpenELIS-Global-2 ${TAG}: https://github.com/DIGI-UW/OpenELIS-Global-2/releases/tag/${TAG}"
          fi

  build:
    name: Build and attach the installer
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build installer
        run: ./build.sh "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.tag }}"

      - name: Check the package holds every compose image
        run: |
          ls -l OEDockerInstaller
          FILE=$(find OEDockerInstaller -name "*.tar.gz" -print -quit)
          tar -xzf "$FILE" --wildcards '*/dockerImage/images.txt' -O | tee images.txt
          grep -q 'openelis-global-2-database' images.txt

      - name: Upload the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE=$(find OEDockerInstaller -name "*.tar.gz" -print -quit)
          gh release upload "${{ needs.prepare.outputs.tag }}" "$FILE" --clobber
