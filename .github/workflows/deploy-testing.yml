name: Deploy to testing.openelis-global.org

on:
  workflow_dispatch:
    inputs:
      image_manifest:
        description: JSON manifest produced by the application's Publish Images workflow
        required: true
        type: string
      enable_review:
        description: Enable the configured central Review widget and verify its identity
        default: false
        type: boolean
      readiness_url:
        description: Application JSON health endpoint
        default: https://testing.openelis-global.org/api/OpenELIS-Global/health
        type: string
      readiness_timeout:
        description: Maximum seconds to wait for readiness
        default: 300
        type: number
      readiness_json_key:
        description: JSON health field (dot-separated for nested fields)
        default: status
        type: string
      readiness_expected:
        description: Expected health value encoded as JSON
        default: '"UP"'
        type: string
      readiness_tls_insecure:
        description: Explicitly allow self-signed TLS for a private health endpoint
        default: false
        type: boolean
  workflow_call:
    inputs:
      image_manifest:
        description: JSON manifest of tested source SHA and immutable DockerHub images
        required: false
        default: ""
        type: string
      enable_review:
        description: Enable the configured central Review widget and verify its identity
        default: false
        type: boolean
      readiness_url:
        default: https://testing.openelis-global.org/api/OpenELIS-Global/health
        type: string
      readiness_timeout:
        default: 300
        type: number
      readiness_json_key:
        default: status
        type: string
      readiness_expected:
        default: '"UP"'
        type: string
      readiness_tls_insecure:
        default: false
        type: boolean

concurrency:
  group: deploy-testing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'testing.openelis-global.org' }}
      DEPLOY_USER: ${{ vars.TESTING_VM_USER || 'ubuntu' }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/openelis-docker' }}
      REMOTE_RUN: /tmp/openelis-deploy-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout deployment contract
        uses: actions/checkout@v6
        with:
          repository: DIGI-UW/openelis-docker
          ref: main

      - name: Validate deployment request
        env:
          IMAGE_MANIFEST: ${{ inputs.image_manifest }}
          ENABLE_REVIEW: ${{ inputs.enable_review }}
          READINESS_URL: ${{ inputs.readiness_url }}
          READINESS_TIMEOUT: ${{ inputs.readiness_timeout }}
          READINESS_JSON_KEY: ${{ inputs.readiness_json_key }}
          READINESS_EXPECTED: ${{ inputs.readiness_expected }}
          READINESS_TLS_INSECURE: ${{ inputs.readiness_tls_insecure }}
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, re, subprocess
          env = os.environ
          if not env['IMAGE_MANIFEST']:
              with open(env['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('Deployment refused: the caller did not provide a tested image manifest. Update the application Publish Images caller. No server changes were made.\n')
              raise SystemExit('A tested image manifest is required; mutable tags cannot identify a deployment')
          for key, pattern in [('DEPLOY_HOST', r'[A-Za-z0-9.-]+'), ('DEPLOY_USER', r'[A-Za-z0-9_-]+'), ('DEPLOY_PORT', r'[0-9]+')]:
              if not re.fullmatch(pattern, env[key]):
                  raise SystemExit(f'Invalid {key}')
          spec = importlib.util.spec_from_file_location('deploy', 'scripts/deploy-testing.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          manifest = module.validate_manifest(json.loads(env['IMAGE_MANIFEST']))
          request = {'manifest': manifest, 'deploy_path': env['DEPLOY_PATH'],
                     'infra_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                     'run_id': env['GITHUB_RUN_ID'] + '-' + env['GITHUB_RUN_ATTEMPT'],
                     'enable_review': env['ENABLE_REVIEW'] == 'true',
                     'readiness': {'url': env['READINESS_URL'], 'timeout': float(env['READINESS_TIMEOUT']),
                                   'key': env['READINESS_JSON_KEY'], 'expected': json.loads(env['READINESS_EXPECTED']),
                                   'insecure': env['READINESS_TLS_INSECURE'] == 'true'}}
          pathlib.Path('request.json').write_text(json.dumps(request))
          PY

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TESTING_VM_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy exact images and wait for readiness
        run: |
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $REMOTE_RUN/diagnostics"
          scp -i ~/.ssh/id_deploy -P "$DEPLOY_PORT" request.json scripts/deploy-testing.py scripts/check-readiness.py "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_RUN/"
          set -o pipefail
          ssh -i ~/.ssh/id_deploy -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "python3 $REMOTE_RUN/deploy-testing.py $REMOTE_RUN/request.json" 2>&1 | tee deployment.log

      - name: Collect deployment diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          if [ -f ~/.ssh/id_deploy ]; then
            scp -i ~/.ssh/id_deploy -P "$DEPLOY_PORT" -r "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_RUN/diagnostics/." diagnostics/ || true
          fi
          if [ -f deployment.log ]; then cp deployment.log diagnostics/; fi

      - name: Attach deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: testing-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Record verified deployment
        if: success()
        run: |
          python3 - <<'PY'
          import json, os
          target = json.load(open('diagnostics/target.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Testing readiness passed for `{target['appSha']}`.\n\n")
              out.write('All five running images match the published digests. [Deployment identity](https://testing.openelis-global.org/__review/target.json).\n')
          PY
      - name: Report failed deployment
        if: failure()
        run: echo 'Testing deployment failed. Inspect the attached status, service logs, and readiness report. A ready identity was not published for this candidate.' >> "$GITHUB_STEP_SUMMARY"
