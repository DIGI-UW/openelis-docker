worker_processes 1;

events { worker_connections 1024; }
http {
    # A proxy in front of this one keeps what it reports; otherwise this
    # proxy reports the address users opened.
    map $http_x_forwarded_host $oe_forwarded_host {
        default $http_x_forwarded_host;
        ''      $http_host;
    }
    map $http_x_forwarded_proto $oe_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;
        server_name _;
        ##### Comment to run on HTTP
         return 301 https://$host:${OE_HTTPS_PORT}$request_uri;

        ##### Uncomment to run on HTTP
        # location / {
        #     proxy_pass http://frontend.openelis.org;
        #     proxy_redirect off;

        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
        # location /api/ {
        #     proxy_pass https://oe.openelis.org:8443/api/;
        #     proxy_redirect off;

        #     proxy_set_header Host $http_host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Host $http_host;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default;
        server_name __;

        ssl_certificate /etc/nginx/certs/${OE_NGINX_CERT};
        ssl_certificate_key /etc/nginx/keys/${OE_NGINX_KEY};

        # $http_host keeps the port the browser used (for example 8443). A proxy
        # in front of this one keeps its X-Forwarded-Host and -Proto (maps above);
        # its X-Forwarded-Port and Forwarded pass through unchanged.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $oe_forwarded_proto;
        proxy_set_header X-Forwarded-Host $oe_forwarded_host;

       absolute_redirect off;

        location / {
            proxy_pass http://frontend.openelis.org;
            proxy_redirect     off;
        }

        location /api/ {
            proxy_pass         https://oe.openelis.org:8443/api/;
            proxy_redirect     off;
        }
    }
}
