location = /__review/target.json {
    alias /etc/nginx/review/target.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

# Keep submissions under the OpenELIS session cookie's context path.
location = /api/OpenELIS-Global/__review/uat-testing/submissions {
    proxy_pass https://grist.openelis-global.org/uat/testing/submissions;
    proxy_ssl_server_name on;
    proxy_ssl_name grist.openelis-global.org;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host grist.openelis-global.org;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    add_header Cache-Control "no-store" always;
}
